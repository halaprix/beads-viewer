name: release

on:
  push:
    tags: ['v*']

permissions:
  # write, because this job creates the GitHub Release for the tag.
  contents: write
  # Kept even though authentication is by token: this is what lets npm attach signed
  # provenance to the published tarball, so consumers can verify it was built from this
  # repository and commit rather than uploaded from someone's laptop.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Writes an .npmrc pointing at the registry and reading NODE_AUTH_TOKEN.
          registry-url: https://registry.npmjs.org
          # Caching is deliberately off on the publish path: a postinstall script from a
          # restored cache would run in the same job as the publishing credential.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node --test test/browser.test.mjs
      - run: node --test --experimental-strip-types test/model.test.ts test/layout.test.ts

      # Pinned to 11, which supports every Node the runner might carry. npm 12 requires
      # ^22.22 || ^24.15 and would fail the job on an older runner image.
      - run: npm install -g npm@11

      # Refuse to publish a tag that disagrees with package.json, rather than shipping a
      # version nobody asked for. Tags are cheap; a wrong published version is forever.
      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi

      # A version already on the registry is not an error worth failing a release over -
      # npm versions are immutable, so republishing is impossible by design. This lets a
      # tag be pushed after a manual publish (which is how 0.1.0 happened) and still get
      # its GitHub Release.
      - name: Publish unless the version is already on the registry
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published; skipping publish"
          else
            # prepack builds dist; publishConfig.access keeps the scoped package public.
            # --provenance attaches a signed attestation tying the tarball to this commit.
            npm publish --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Create the GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
